<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1f4b">
<title>Cube Hop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=24">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <button id="pause" class="icon" data-t-label="hud.pause">:pause:</button>
  <span id="cubes">:gem: 0</span>
  <span id="level"></span>
  <span id="pet" class="hidden"></span>
  <div id="time"><span id="autoLv">LV 1</span><i id="timeBar" data-t-title="hud.autonomy"><b id="timeFill"></b></i>:clock:<span id="clock"></span></div>
  <button id="devBtn" class="icon hidden" data-t-label="hud.dev">:dev:</button>
  <button id="calmBtn" class="icon hidden" data-t-label="hud.calm">:breathe:</button>
  <button id="mute" class="icon" data-t-label="hud.sound">:sound:</button>
</div>

<div id="pad" class="hidden">
  <div id="dpad"><b class="u">:up:</b><b class="l">:left:</b><i></i><b class="r">:right:</b><b class="d">:down:</b></div>
  <div id="ab"><button id="bB">B</button><button id="bA">A</button></div>
</div>

<div id="hint"></div>

<div id="title" class="screen">
  <h1>CUBE<br>HOP</h1>
  <div id="petTitle" class="hidden"></div>
  <div id="pick" class="btns"><button id="withPip"></button><button id="noPip" data-t="title.noPip"></button></div>
  <p id="weekInfo"></p>
  <div class="btns">
    <button id="continue" data-t="title.continue"></button>
    <button id="newGame" data-t="title.newGame"></button>
    <button id="resetWeek" data-t="title.resetTime"></button>
  </div>
  <p class="pc" data-t="title.pcHelp"></p>
  <button id="parents" class="ghost" data-t="title.grownUps"></button>
</div>

<div id="modal" class="screen hidden"></div>

<div id="rotate" class="screen">:reset:<p data-t="title.rotate"></p></div>

<script src="lang.js?v=24"></script>
<script src="levels.js?v=24"></script>
<script src="icons.js?v=24"></script>
<script>for (const e of document.querySelectorAll('#hud, #pad, #title, #rotate')) e.innerHTML = icons(e.innerHTML); applyText();</script>
<script src="game.js?v=24"></script>
<script src="session.js?v=24"></script>
<script src="mascot.js?v=24"></script>
</body>
</html>
