<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1f4b">
<title>Cube Hop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<!-- bump ?v= on every update so phones load the new files -->
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <button id="pause" class="icon" aria-label="Pause">⏸</button>
  <span id="cubes">◆ 0</span>
  <span id="level"></span>
  <div id="time"><i id="timeBar"><b id="timeFill"></b><span id="notches"></span></i><span id="clock"></span></div>
  <button id="devBtn" class="icon hidden" aria-label="Dev mode">🛠</button>
  <button id="calmBtn" class="icon hidden" aria-label="Calm down">🧘</button>
  <button id="mute" class="icon" aria-label="Sound">🔊</button>
</div>

<div id="pad" class="hidden">
  <div id="dpad"><b class="u">▲</b><b class="l">◀</b><i></i><b class="r">▶</b><b class="d">▼</b></div>
  <div id="ab"><button id="bB">B</button><button id="bA">A</button></div>
</div>

<div id="hint"></div>

<div id="title" class="screen">
  <h1>CUBE<br>HOP</h1>
  <p id="weekInfo"></p>
  <div class="btns">
    <button id="continue">▶ CONTINUE</button>
    <button id="newGame">NEW GAME</button>
    <button id="resetWeek">↺ RESET WEEK (TEST)</button>
  </div>
  <p class="pc">💻 Arrows walk · Space jump · Shift dash · hold E = angry shake</p>
  <button id="parents" class="ghost">⚙ Grown-ups</button>
</div>

<div id="modal" class="screen hidden"></div>

<div id="rotate" class="screen">↻<p>Turn your phone sideways</p></div>

<script src="levels.js?v=10"></script>
<script src="game.js?v=10"></script>
<script src="session.js?v=10"></script>
</body>
</html>
